# fiat-agent runtime configuration (DEV_SPEC §8).
# Secrets are referenced by ENV var name (api_key_env) and never inlined.
# `${VAR:-default}` is resolved at load time by load_settings().

app:
  name: fiat-agent
  environment: ${FiatAgent_ENV:-dev}

database:
  # 当前默认 SQLite（零运维、零外部依赖，适合开发 / 单机 / 低风险场景）。
  # PostgreSQL 作为扩展点：设置环境变量 FIAT_DB_URL=postgresql+asyncpg://...
  # 即可切换，无需改动代码（引擎工厂按 URL scheme 自动选择驱动）。
  # 升级 PG 的前置条件见项目决策笔记（SQLite vs PostgreSQL）。
  url: ${FIAT_DB_URL:-sqlite+aiosqlite:///./data/fiat_agent.db}

redis:
  url: redis://localhost:6379/0

models:
  # 默认模型（未被路由策略显式覆盖时的兜底）。实际路由见 config/model_policies.yaml (D3)。
  default: gpt-5.6-terra
  providers:
    # 逻辑 provider 名需与 config/model_policies.yaml 中的 providers 一致。
    gpt:
      api_key_env: FIAT_MODEL_GPT_KEY
    deepseek:
      api_key_env: FIAT_MODEL_DEEPSEEK_KEY
    local:
      api_key_env: FIAT_MODEL_LOCAL_KEY

mcp_servers:
  rag:
    name: modular-rag-mcp-server
    transport: stdio
    cwd: /Users/tog/Desktop/project/MODULAR-RAG-MCP-SERVER
    command: python
    args:
      - -m
      - src.mcp_server.server

session:
  max_context_tokens: 80000
  compact_threshold_ratio: 0.75
  jsonl_export_enabled: true

tools:
  default_timeout_seconds: 30
  production_write_requires_approval: true

event_stream:
  transport: sse
