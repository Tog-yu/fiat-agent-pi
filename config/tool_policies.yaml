# Tool authorization policies (DEV_SPEC B3).
# Declarative, deterministic, no LLM. Loaded by fiat_agent.auth.rbac.
# Risk tiers: L1 (low) .. L5 (high). Environments: dev/staging/prod.

policies:
  - tool: cashback_reconcile        # 返现对账 dry-run (no production write)
    risk_level: L4
    allowed_roles: [ops, oncall]
    allowed_environments: [dev, staging]
    approval_required: true
    allowed_scopes: [cashback_dryrun]
    collection_scopes:
      oncall: [cashback_readonly]
      ops: [cashback_all]

  - tool: cashback_submit           # 生产提交 (disabled for MVP)
    risk_level: L5
    allowed_roles: []               # nobody may auto-submit in MVP
    allowed_environments: [prod]
    approval_required: true
    allowed_scopes: [cashback_prod]
    denied_actions: [submit_prod]

  - tool: cashback_parse             # 返现表格解析 (read-only parse, no write)
    risk_level: L1
    allowed_roles: [oncall, ops, viewer]
    allowed_environments: [dev, staging, prod]
    allowed_scopes: [cashback_readonly]

  - tool: es_search_logs            # ES 只读（注册名 fiat_es_search_logs，policyToolName 剥前缀）
    risk_level: L2
    allowed_roles: [oncall, ops]
    allowed_environments: [dev, staging, prod]
    allowed_scopes: [es_read]

  - tool: db_query                  # DB 只读
    risk_level: L2
    allowed_roles: [oncall, ops]
    allowed_environments: [dev, staging, prod]
    allowed_scopes: [db_read]

  - tool: rag_query                 # 知识库检索
    risk_level: L1
    allowed_roles: [oncall, ops, viewer]
    allowed_environments: [dev, staging, prod]
    allowed_scopes: [rag]

  - tool: alert_diagnosis           # 告警诊断（只读证据收集 + 模型分析）
    risk_level: L1
    allowed_roles: [oncall, ops, viewer]
    allowed_environments: [dev, staging, prod]
    allowed_scopes: [alert_readonly]

  - tool: lark_send                 # Lark 告警通知（非破坏性，注册名 fiat_lark_send）
    risk_level: L2
    allowed_roles: [oncall, ops]
    allowed_environments: [dev, staging, prod]
    allowed_scopes: [lark_notify]

  - tool: logistics_validate        # 物流表格校验（只读，不写生产）
    risk_level: L1
    allowed_roles: [oncall, ops, viewer]
    allowed_environments: [dev, staging, prod]
    allowed_scopes: [logistics_readonly]

  - tool: logistics_parse           # 物流表格解析（只读，注册名 fiat_logistics_parse）
    risk_level: L1
    allowed_roles: [oncall, ops, viewer]
    allowed_environments: [dev, staging, prod]
    allowed_scopes: [logistics_readonly]

  - tool: test_env                  # 测试环境自动化（仅 DEV）
    risk_level: L3
    allowed_roles: [oncall, ops]
    allowed_environments: [dev]
    allowed_scopes: [test_env]

  - tool: job_apply                 # 执行已审批工单（fiat_job_apply，policyToolName 剥前缀）
    risk_level: L4
    allowed_roles: [ops, oncall]
    allowed_environments: [dev, staging, prod]
    approval_required: true
    allowed_scopes: [job_apply]

  # 阶段 12（P12-65）：技能正文按需读取（fiat_skill_view，policyToolName 剥前缀）。
  # 只读工具：技能库索引已注入 systemPrompt，正文按需拉取。L1 风险，三环境可读。
  # 注：本文件是**人写锚点**，自进化只读不写（阶段 12 硬约束 3）——这条由人（本阶段实现）添加。
  - tool: skill_view                # 读取技能正文（注册名 fiat_skill_view）
    risk_level: L1
    allowed_roles: [oncall, ops, viewer]
    allowed_environments: [dev, staging, prod]
    allowed_scopes: [skill_read]

  # 阶段 15（P15-92）：检索跨会话长期记忆（注册名 fiat_memory_search，policyToolName 剥前缀）。
  #
  # ⚠️ **这条必须加**：`policy/engine.ts:83` 对未知工具**默认拒绝**（fail-closed）——
  #    新工具漏配策略会静默全灭（阶段 13 已踩过同类坑）。
  #
  # 为什么是 L1 只读：`scope` / `key` 由宿主闭包注入、**不出现在工具 schema 里**
  # （§15.14 硬约束 3），模型既看不到也改不了隔离边界，因此它没有越权读取他人记忆的路径。
  # 硬约束 1 也保证主会话**永不出现写工具** —— 记忆写入只能由 L2 确定性代码发起。
  #
  # ⚠️ 刻意**不给** `collection_scopes`：`engine.ts:62` 的 collectionVerdict 在角色配了
  #    `collection_scopes` 且入参没有 `collection` 时会**改写 input 注入 collection**。
  #    而本工具的隔离边界是 scope+key、且这两个字段根本不在 schema 里 ——
  #    多注入一个 collection 字段既无意义，又会给「谁决定分区」留下第二个说法。
  - tool: memory_search             # 检索跨会话记忆（注册名 fiat_memory_search）
    risk_level: L1
    allowed_roles: [oncall, ops, viewer]
    allowed_environments: [dev, staging, prod]
    allowed_scopes: [memory_read]
